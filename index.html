<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NASA Astronomy Picture of the Day</title>
  <meta name="description" content="Explore NASA's daily astronomy picture with date navigation, a custom calendar, lightbox view, and light/dark themes.">
  <meta name="google-site-verification" content="WTN1ldB8dWad3UnhYOtcKPgCBb7y4WuWrqP6kk4UIwc" />

  <!-- Open Graph / Facebook / Twitter -->
  <meta property="og:title" content="NASA Astronomy Picture of the Day">
  <meta property="og:description" content="Explore NASA's daily astronomy picture with date navigation, a custom calendar, lightbox view, and light/dark themes.">
  <meta property="og:image" content="https://live-data-dashboard-rho.vercel.app/screenshots/screenshot-dark.png">
  <meta property="og:url" content="https://live-data-dashboard-rho.vercel.app/">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <span class="nasa-badge">NASA</span>
      <span class="header-label">Astronomy Picture of the Day</span>
      <button id="theme-toggle" class="theme-toggle" aria-label="Toggle light/dark theme" title="Toggle theme">
        <!-- Moon icon (shown in dark mode) -->
        <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <!-- Sun icon (shown in light mode) -->
        <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
      </button>
      <a id="github-link"
         href="https://github.com/DushyantSingh7120/Live-Data-Dashboard"
         target="_blank"
         rel="noopener noreferrer"
         aria-label="View on GitHub"
         class="github-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
        </svg>
      </a>
    </div>
  </header>
  <!-- Apply persisted theme before first paint to prevent flash -->
  <script>
    (function() {
      if (localStorage.getItem('apod-theme') === 'light') {
        document.documentElement.classList.add('light-theme');
      }
    })();
  </script>

  <main class="main">
    <div class="date-nav" role="group" aria-label="Date navigation">
      <button id="btn-prev" class="nav-btn" aria-label="Previous day">&#9664; Previous</button>
      <div class="custom-datepicker" id="custom-datepicker">
        <button type="button" id="date-picker-btn" class="nav-btn date-picker-btn" aria-haspopup="dialog" aria-expanded="false" aria-label="Select date">
          <span id="date-picker-label"></span>
          <span class="calendar-icon">📅</span>
        </button>
        <div id="calendar-dropdown" class="calendar-dropdown hidden" role="dialog" aria-modal="true" aria-label="Calendar">
          <div class="calendar-header">
            <button type="button" id="cal-prev-month" class="cal-nav-btn" aria-label="Previous Month">&lsaquo;</button>
            <button type="button" id="cal-month-year" class="cal-month-year-btn" aria-label="Choose month and year" aria-live="polite"></button>
            <button type="button" id="cal-next-month" class="cal-nav-btn" aria-label="Next Month">&rsaquo;</button>
          </div>
          <div id="cal-view-days" class="cal-view">
            <div class="cal-weekdays">
              <span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span>
            </div>
            <div id="cal-days" class="cal-days"></div>
          </div>
          <div id="cal-view-years" class="cal-view hidden">
            <div id="cal-years-list" class="cal-years-list"></div>
          </div>
          <div id="cal-view-months" class="cal-view hidden">
            <div id="cal-months-grid" class="cal-months-grid"></div>
          </div>
        </div>
      </div>
      <button id="btn-next" class="nav-btn" aria-label="Next day">&#9654; Next</button>
      <button id="btn-random" class="nav-btn nav-btn--accent" aria-label="Random date">&#127922; Random</button>
    </div>

    <div id="apod-card" class="card" aria-live="polite">

      <div id="skeleton" class="skeleton-group">
        <div class="skeleton skeleton-media"></div>
        <div class="skeleton skeleton-title"></div>
        <div class="skeleton skeleton-date"></div>
        <div class="skeleton skeleton-text"></div>
        <div class="skeleton skeleton-text short"></div>
      </div>

      <div id="apod-content" class="apod-content hidden">
        <div id="media-wrapper" class="media-wrapper"></div>
        <div class="card-body">
          <div class="meta-row">
            <h1 id="apod-title" class="apod-title"></h1>
            <time id="apod-date" class="apod-date"></time>
          </div>
          <p id="apod-explanation" class="apod-explanation"></p>
          <p id="apod-copyright" class="apod-copyright"></p>
        </div>
      </div>

      <div id="apod-error" class="error-state hidden">
        <span class="error-icon">⚠️</span>
        <p>Failed to load today's picture. Please try again.</p>
      </div>

    </div>
  </main>

  <!-- Lightbox modal -->
  <div id="lightbox" class="lightbox hidden" role="dialog" aria-modal="true" aria-label="Full-size image viewer">
    <button id="lightbox-close" class="lightbox-close" aria-label="Close">&times;</button>
    <img id="lightbox-img" class="lightbox-img" src="" alt="">
  </div>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
