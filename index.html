<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NASA Astronomy Picture of the Day</title>
  <meta name="description" content="NASA's Astronomy Picture of the Day — explore the cosmos one image at a time.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <span class="nasa-badge">NASA</span>
      <span class="header-label">Astronomy Picture of the Day</span>
      <a id="github-link"
         href="https://github.com/DushyantSingh7120/E-Commerce-Wishlist.git"
         target="_blank"
         rel="noopener noreferrer"
         aria-label="View on GitHub"
         class="github-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
        </svg>
      </a>
    </div>
  </header>

  <main class="main">
    <div class="date-nav" role="group" aria-label="Date navigation">
      <button id="btn-prev" class="nav-btn" aria-label="Previous day">&#9664; Previous</button>
      <input type="date" id="date-picker" aria-label="Select date">
      <button id="btn-next" class="nav-btn" aria-label="Next day">&#9654; Next</button>
      <button id="btn-random" class="nav-btn nav-btn--accent" aria-label="Random date">&#127922; Random</button>
    </div>

    <div id="apod-card" class="card" aria-live="polite">

      <div id="skeleton" class="skeleton-group">
        <div class="skeleton skeleton-media"></div>
        <div class="skeleton skeleton-title"></div>
        <div class="skeleton skeleton-date"></div>
        <div class="skeleton skeleton-text"></div>
        <div class="skeleton skeleton-text short"></div>
      </div>

      <div id="apod-content" class="apod-content hidden">
        <div id="media-wrapper" class="media-wrapper"></div>
        <div class="card-body">
          <div class="meta-row">
            <h1 id="apod-title" class="apod-title"></h1>
            <time id="apod-date" class="apod-date"></time>
          </div>
          <p id="apod-explanation" class="apod-explanation"></p>
          <p id="apod-copyright" class="apod-copyright"></p>
        </div>
      </div>

      <div id="apod-error" class="error-state hidden">
        <span class="error-icon">⚠️</span>
        <p>Failed to load today's picture. Please try again.</p>
      </div>

    </div>
  </main>

  <!-- Lightbox modal -->
  <div id="lightbox" class="lightbox hidden" role="dialog" aria-modal="true" aria-label="Full-size image viewer">
    <button id="lightbox-close" class="lightbox-close" aria-label="Close">&times;</button>
    <img id="lightbox-img" class="lightbox-img" src="" alt="">
  </div>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
